<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged, GoogleAuthProvider, FacebookAuthProvider, GithubAuthProvider, TwitterAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { autoReloadOnSync, broadcastReload } from './sync.js';

const firebaseConfig = {
  apiKey: "AIzaSyA_XJP_fmStr4GYA7pD51I_SS5TXeDXdUM",
  authDomain: "aichat-fc13c.firebaseapp.com",
  projectId: "aichat-fc13c",
  storageBucket: "aichat-fc13c.firebasestorage.app",
  messagingSenderId: "177676055139",
  appId: "1:177676055139:web:f504149bdea3ce7b6cfe56"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);

// Timeout race: nếu lệnh Firestore quá lâu (mạng yếu) thì trả fallback thay vì treo vô hạn
function withTimeout(promise, ms, fallback) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(fallback), ms))
  ]);
}

// Đồng hồ đếm ngược ước tính, chỉ mang tính hiển thị (không chặn logic thật đang chạy song song)
function runCountdown(elementId, seconds) {
  const el = document.getElementById(elementId);
  let remaining = seconds;
  el.textContent = `Ước tính còn ${remaining} giây`;
  const interval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      el.textContent = 'Sắp xong...';
      clearInterval(interval);
    } else {
      el.textContent = `Ước tính còn ${remaining} giây`;
    }
  }, 1000);
  return interval;
}

// Kiểm tra version, nhận sẵn snapshot đã fetch để khỏi gọi getDoc lần 2
function checkAppVersionFromSnap(snap) {
  const LOCAL_VERSION_KEY = 'aichater_app_version';
  if (!snap || !snap.exists()) return false;
  const remoteVersion = snap.data().version;
  const localVersion = localStorage.getItem(LOCAL_VERSION_KEY);
  if (localVersion === null) {
    localStorage.setItem(LOCAL_VERSION_KEY, String(remoteVersion));
    return false;
  }
  return String(remoteVersion) !== String(localVersion);
}

async function proceedToUpdateCheckThenRedirect(destination, versionSnap) {
  document.getElementById('auth-check-overlay').style.display = 'none';
  document.getElementById('update-check-overlay').style.display = 'flex';

  const countdownTimer = runCountdown('update-check-countdown', 2);
  const needsUpdate = checkAppVersionFromSnap(versionSnap);
  clearInterval(countdownTimer);

  if (needsUpdate) {
    localStorage.setItem('aichater_app_version_pending_notice', '1');
  }

  window.location.href = destination;
}

// Check nếu đã đăng nhập rồi thì redirect luôn, chưa thì mới hiện form login
runCountdown('auth-check-countdown', 2);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      // Gộp 2 lệnh getDoc chạy SONG SONG thay vì tuần tự + timeout 6s tránh treo vô hạn
      const [userSnap, versionSnap] = await Promise.all([
        withTimeout(getDoc(doc(db, 'users', user.uid)), 6000, null),
        withTimeout(getDoc(doc(db, 'config', 'appVersion')), 6000, null)
      ]);

      if (userSnap && userSnap.exists() && userSnap.data().onboardingDone) {
        await proceedToUpdateCheckThenRedirect('home.html', versionSnap);
      } else if (userSnap) {
        await proceedToUpdateCheckThenRedirect('onboarding.html', versionSnap);
      } else {
        // Timeout khi đọc users -> không kẹt, cho vào home mặc định (an toàn hơn onboarding lặp)
        await proceedToUpdateCheckThenRedirect('home.html', versionSnap);
      }
    } catch (e) {
      document.getElementById('auth-check-overlay').style.display = 'none';
    }
  } else {
    document.getElementById('auth-check-overlay').style.display = 'none';
  }
});

const khung = document.querySelector('.khung');
const dangnhapLink = document.querySelector('.dangnhap-link');
const dangkyLink = document.querySelector('.dangky-link');
const modangnhap = document.querySelector('.nutdangnhap');
const icontat = document.querySelector('.icon-tat');

dangkyLink.addEventListener('click', () => khung.classList.add('bat'));
dangnhapLink.addEventListener('click', () => khung.classList.remove('bat'));
modangnhap.addEventListener('click', () => khung.classList.add('bat-popup'));
icontat.addEventListener('click', () => khung.classList.remove('bat-popup'));

// Đăng ký
document.querySelector('.nut-dangky').addEventListener('click', async (e) => {
  e.preventDefault();
  const inputs = document.querySelectorAll('.khung-reg-kieu input');
  const ten = inputs[0].value.trim();
  const email = inputs[1].value.trim();
  const matkhau = inputs[2].value.trim();
  if (!ten || !email || !matkhau) { alert('Điền đầy đủ thông tin nha!'); return; }
  try {
    const uc = await createUserWithEmailAndPassword(auth, email, matkhau);
    await setDoc(doc(db, 'users', uc.user.uid), {
      ten, email,
      taoLuc: new Date().toISOString()
    });
    alert('Đăng ký thành công! Đăng nhập đi nha :))');
    khung.classList.remove('bat');
  } catch(err) {
    alert('Lỗi: ' + err.message);
  }
});

// Đăng nhập
document.querySelector('.nut-dangnhap').addEventListener('click', async (e) => {
  e.preventDefault();
  const inputs = document.querySelectorAll('.khung-login-kieu input');
  const email = inputs[0].value.trim();
  const matkhau = inputs[1].value.trim();
  if (!email || !matkhau) { alert('Điền email và mật khẩu nha!'); return; }
  try {
    const uc = await signInWithEmailAndPassword(auth, email, matkhau);
    await redirectAfterLogin(uc.user);
  } catch(err) {
    alert('Sai email hoặc mật khẩu rồi :((');
  }
});

// ===== Đăng nhập qua mạng xã hội =====
async function redirectAfterLogin(user) {
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists() && snap.data().onboardingDone) {
    window.location.href = 'home.html';
  } else {
    // Tài khoản mới qua social login -> tạo bản ghi user cơ bản nếu chưa có
    if (!snap.exists()) {
      await setDoc(doc(db, 'users', user.uid), {
        ten: user.displayName || 'Người dùng mới',
        email: user.email || '',
        taoLuc: new Date().toISOString()
      });
    }
    window.location.href = 'onboarding.html';
  }
}

async function socialSignIn(provider) {
  try {
    const result = await signInWithPopup(auth, provider);
    await redirectAfterLogin(result.user);
  } catch (err) {
    if (err.code === 'auth/account-exists-with-different-credential') {
      alert('Email này đã đăng ký bằng phương thức khác rồi, thử đăng nhập cách khác nha!');
    } else if (err.code === 'auth/popup-closed-by-user') {
      // Người dùng tự đóng popup, không cần báo lỗi
    } else {
      alert('Lỗi đăng nhập: ' + err.message);
    }
  }
}

document.getElementById('btn-google-login').addEventListener('click', () => {
  socialSignIn(new GoogleAuthProvider());
});
document.getElementById('btn-facebook-login').addEventListener('click', () => {
  socialSignIn(new FacebookAuthProvider());

document.getElementById('btn-github-login').addEventListener('click', () => {
